<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fixed black tile, not scheme-adaptive: the site itself never leaves
       dark (color-scheme: dark), so the mark should match it everywhere
       rather than invert in a light browser chrome. -->
  <rect width="180" height="180" rx="37" fill="#000000" />
  <!-- A compressed version of the hero's Sun gradient (components/sun.tsx):
       same stop colors, but opaque all the way to the edge instead of
       fading into a transparent corona, which would vanish at 16-32px. -->
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6e6" />
      <stop offset="25%" stop-color="#ffd27a" />
      <stop offset="50%" stop-color="#ffab3d" />
      <stop offset="75%" stop-color="#ff7a1e" />
      <stop offset="100%" stop-color="#ff6a2b" />
    </radialGradient>
  </defs>
  <circle cx="90" cy="90" r="60" fill="url(#sun)" />
</svg>
